name: Publish @danypops/tickets

# Trusted publishing (OIDC): no long-lived npm tokens. npm CLI detects the
# OIDC environment automatically (requires npm >= 11.5.1). Configure the
# trusted publisher on npmjs.com: org=DanyPops repo=tickets workflow=publish.yml
# -- this is a one-time, manual, npmjs.com-website-only step that must be
# done before the first tag push can succeed (a package with no trusted
# publisher configured yet fails its publish step with a 404/403, not a
# silent skip).
#
# Tag stays a bare "v*" for continuity with this package's existing release
# history (v0.1.0, v0.2.0) predating the packages/pi-tickets workspace
# member -- see publish-pi-tickets.yml for that package's own tag/workflow.

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tickets
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install
        working-directory: .

      - run: bun run test
      - run: bun run typecheck

      # npm CLI only for the publish step (trusted publishing needs >= 11.5.1).
      # NO registry-url here: it makes setup-node write an .npmrc with an empty
      # NODE_AUTH_TOKEN line, which shadows OIDC auto-detection and breaks
      # trusted publishing with a 404.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; Node's bundled npm can be older.
      - run: npm install -g npm@latest && npm --version

      - run: npm publish --access public
